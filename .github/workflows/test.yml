# Builds and tests every PR and push to main. The required check that gates
# auto-merge on main.
name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test
        run: scripts/test.sh
      - name: Build app
        run: USAGEBAR_APP="$RUNNER_TEMP/UsageBar.app" scripts/build.sh
